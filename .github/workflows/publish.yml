name: Publish

# Publishes to PyPI on a version tag (v1.0.0).
# Configure Trusted Publishing for this workflow on https://pypi.org/manage/account/publishing/
# Project: failtree · Owner: Lucifer-bit0/Failtree · Workflow: publish.yml · Environment: pypi

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build
        run: python -m pip install --upgrade pip build
      - name: Build
        run: python -m build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
