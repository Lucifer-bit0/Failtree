[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "failtree"
version = "1.0.0"
description = "Local-first pipeline error capture, root-cause grouping, and retry export"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [{ name = "failtree contributors" }]
keywords = ["etl", "pipeline", "errors", "fingerprint", "sqlite", "textual"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
  "exceptiongroup>=1.2.0; python_version < '3.11'",
]

[project.optional-dependencies]
tui = ["textual>=0.60"]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
  "textual>=0.60",
  "build>=1.2",
]

[project.urls]
Homepage = "https://github.com/Lucifer-bit0/Failtree"
Repository = "https://github.com/Lucifer-bit0/Failtree"
Issues = "https://github.com/Lucifer-bit0/Failtree/issues"
Changelog = "https://github.com/Lucifer-bit0/Failtree/blob/main/CHANGELOG.md"
Documentation = "https://github.com/Lucifer-bit0/Failtree/tree/main/docs"

[project.scripts]
failtree = "failtree.cli:main"

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/docs",
  "/examples",
  "/README.md",
  "/LICENSE",
  "/CHANGELOG.md",
  "/CONTRIBUTING.md",
  "/pyproject.toml",
]

[tool.hatch.build.targets.wheel]
packages = ["src/failtree"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
# Keep CI focused; style migrations (UP) can land in follow-ups.
select = ["E", "F", "I"]
ignore = ["E501"]
