[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "failtree"
version = "0.1.0"
description = "Local-first pipeline error capture, root-cause grouping, and retry export"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
authors = [{ name = "failtree contributors" }]
keywords = ["etl", "pipeline", "errors", "fingerprint", "sqlite", "textual"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
  "exceptiongroup>=1.2.0; python_version < '3.11'",
]

[project.optional-dependencies]
tui = ["textual>=0.60"]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
  "textual>=0.60",
]

[project.scripts]
failtree = "failtree.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/failtree"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
